<!DOCTYPE HTML>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estudio Prack | Renderizados</title>
    <meta name="description" content="Estudio Prack: arquitectura para empresas y oficinas, interiorismo y renderizados del arquitecto Jorge Prack. Contacto: +54 9 11 4063 9771. Instagram: @prackjorge">
    <meta name="keywords" content="Estudio Prack, Jorge Prack, arquitectura, interiorismo, renderizados, Buenos Aires, contacto,teléfono, email, Instagram">
    <meta name="author" content="Estudio Prack">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <!-- Navbar -->
    <div class="navbar">
        <h2>EP | Renderizados</h2>
        <h5>
            <a href="obras.html" class="custom-linkb">Obras</a>
            <a href="mailto:estudioprack@gmail.com" class="custom-linkb">&nbsp;&nbsp;Contacto</a>
            <a href="https://instagram.com/prackjorge" target="_blank" class="custom-linkb">&nbsp;&nbsp;Instagram</a>
        </h5>
    </div>

    <!-- Subtitle -->
    <div class="subtitle">
        <h2>No hay proyectos grandes o pequeños.</h2>
    </div>

    <div class="container-fluid">
        <div class="row slider-row">
            <div class="col-md-6 position-relative slider-column">
                <img src="../images/fondo1.png" class="slide2" alt="Render 1">
                <img src="../images/fondo2.png" class="slide2" alt="Render 2">
            </div>
            <div class="col-md-6 position-relative slider-column">
                <img src="../images/fondo3.png" class="slide2" alt="Render 3">
                <img src="../images/fondo4.png" class="slide2" alt="Render 4">
            </div>
        </div>
        <div class="row slider-row">
            <div class="col-md-6 position-relative slider-column">
                <img src="../images/fondo1.png" class="slide2" alt="Render 1">
                <img src="../images/fondo2.png" class="slide2" alt="Render 2">
            </div>
            <div class="col-md-6 position-relative slider-column">
                <img src="../images/fondo3.png" class="slide2" alt="Render 3">
                <img src="../images/fondo4.png" class="slide2" alt="Render 4">
            </div>
        </div>
        <!-- Content -->
        <div class="subtitle">
            <h2>A cada cliente le dedicamos toda</h2>
            <h2>nuestra experiencia y atención por igual, garantizando la mejor</h2>
            <h2>imagen y una comunicación efectiva.</h2>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Slider Fade JS -->
    <script>
        const fadeDuration = 1000; // ms
        const displayDuration = 3000; // ms

        document.querySelectorAll('.slider-column').forEach(column => {
            const slides = column.querySelectorAll('.slide2');

            let current = 0;

            slides.forEach((slide, index) => {
                slide.style.position = 'absolute';
                slide.style.top = 0;
                slide.style.left = 0;
                slide.style.width = '100%';
                slide.style.opacity = index === 0 ? 1 : 0;
                slide.style.transition = `opacity ${fadeDuration/1000}s linear`;
            });

            setInterval(() => {
                slides[current].style.opacity = 0;
                current = (current + 1) % slides.length;
                slides[current].style.opacity = 1;
            }, fadeDuration + displayDuration);
        });
    </script>
</body>
</html>
