<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Arquitecto Jorge Prack</title>
        <meta name="description" content="Estudio Prack: arquitectura para empresas y oficinas, interiorismo y renderizados del arquitecto Jorge Prack. Contacto: +54 9 11 4063 9771. Instagram: @prackjorge">
        <meta name="keywords" content="Estudio Prack, Jorge Prack, arquitectura, interiorismo, renderizados, Buenos Aires, contacto,teléfono, email, Instagram">
        <meta name="author" content="Estudio Prack">

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>

    <body class="text-white">
        <!-- Slides -->
        <div id="slides">
            <img src="images/fondo1.png" class="slide visible" alt="Fondo 1">
            <img src="images/fondo2.png" class="slide" alt="Fondo 2">
            <img src="images/fondo3.png" class="slide" alt="Fondo 3">
            <img src="images/fondo4.png" class="slide" alt="Fondo 4">
            <div class="carousel-overlay"></div>
        </div>

        <!-- Texto -->
        <div class="text-white carousel-caption d-none d-md-block">
            <h1 class="text-white lined">ESTUDIO PRACK</h1>
            <h3 class="text-white subtitulo">Soluciones en arquitectura</h3>
            <h2>
                <a href="templates/arquitectura.html" class="text-white custom-link">Arquitectura </a><span class="text-white">|</span>
                <a href="templates/EP_renders.html" class="text-white custom-link">EP_renders </a><span class="text-white">|</span>
                <a href="mailto:estudioprack@gmail.com" class="text-white custom-link">Contacto </a><span class="text-white">|</span>
                <a href="https://instagram.com/prackjorge" target="_blank" class="text-white custom-link">Instagram</a>
            </h2>
        </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Loop Fade JS -->
        <script>
            const slides = document.querySelectorAll('.slide');
            let current = 0;
            const fadeDuration = 4000;  // ms
            const displayDuration = 4000; // ms (tiempo que la foto está completamente visible)

            function showNextSlide() {
                const prev = slides[current];
                current = (current + 1) % slides.length;
                const next = slides[current];

                // Fade out previo
                prev.style.opacity = 0;

                // Fade in siguiente
                next.style.transition = `opacity ${fadeDuration/1000}s linear`;
                next.style.opacity = 1;
            }

            // Inicializa ciclo
            setInterval(showNextSlide, fadeDuration + displayDuration);
        </script>
    </body>
</html>
